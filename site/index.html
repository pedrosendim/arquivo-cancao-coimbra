<!doctype html>
<html lang="pt-PT" data-estilo="museu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Arquivo da Canção de Coimbra</title>
  <meta name="description" content="Ferramenta de estudo que organiza, com fontes, a informação sobre a Canção de Coimbra.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 3c5 7 9 11.5 9 17a9 9 0 0 1-18 0c0-5.5 4-10 9-17z' fill='%23b4441f'/%3E%3C/svg%3E">
  <!-- no ecrã principal (iPhone: Partilhar › Adicionar ao ecrã principal) abre como aplicação, com este ícone e nome -->
  <link rel="apple-touch-icon" href="icones/apple-touch-icon.png">
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Arquivo">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#efede8">
  <script>
    // os dados começam a chegar já, em paralelo com o CSS e os módulos (estado.js usa este pedido no arranque);
    // «no-cache»: o browser pergunta sempre se há versão nova e só descarrega o ficheiro quando mudou
    window.basePedida = fetch('dados/base.json', { cache: 'no-cache' }).then((r) => (r.ok ? r.json() : null)).catch(() => null);
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/estilo.css">
  <link rel="stylesheet" href="css/estilos.css">
  <script>
    try {
      const t = localStorage.getItem('tema'); if (t) document.documentElement.dataset.theme = t;
      if (t === 'dark') document.querySelector('meta[name="theme-color"]').content = '#161614'; // a barra do iPhone com a cor do fundo
      if (localStorage.getItem('menuRecolhido') === 'true') document.documentElement.classList.add('menu-recolhido');
    } catch { /* sem armazenamento */ }
  </script>
</head>
<body>
  <button class="saltar" id="saltar" type="button">Saltar para o conteúdo</button>
  <div class="moldura">
    <aside class="lateral" aria-label="Navegação">
      <a class="marca-site" href="#/" title="Início">
        <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 3c5 7 9 11.5 9 17a9 9 0 0 1-18 0c0-5.5 4-10 9-17z"/></svg>
        <span><b>Arquivo</b><small>da Canção de Coimbra</small></span>
      </a>
      <button class="procura-global" id="abrir-paleta" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <span>Procurar…</span><kbd>Ctrl K</kbd>
      </button>
      <!-- no telemóvel, o menu e as preferências ficam numa folha que este botão abre -->
      <button class="abrir-menu" id="abrir-menu" type="button" aria-expanded="false" aria-controls="menu-folha">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg><span>Menu</span>
      </button>
      <div class="menu-folha" id="menu-folha">
      <nav id="nav">
        <p class="nav-grupo">Estudar</p>
        <a href="#/pessoas" data-rota="pessoas"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.5 3.4-5.5 6.5-5.5s5.7 2 6.5 5.5"/><path d="M16 4.8a3.3 3.3 0 0 1 0 6.4M18.5 14.8c1.6.8 2.7 2.6 3 5.2"/></svg><span>Pessoas</span></a>
        <a href="#/grupos" data-rota="grupos"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="7" cy="9" r="2.6"/><circle cx="17" cy="9" r="2.6"/><circle cx="12" cy="6.5" r="2.6"/><path d="M2.5 19c.6-2.8 2.4-4.3 4.5-4.3M21.5 19c-.6-2.8-2.4-4.3-4.5-4.3M7 19.5c.7-3.2 2.7-5 5-5s4.3 1.8 5 5"/></svg><span>Grupos</span></a>
        <a href="#/linhagens" data-rota="linhagens"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="4.5" r="2"/><circle cx="5" cy="19.5" r="2"/><circle cx="19" cy="19.5" r="2"/><circle cx="12" cy="12" r="2"/><path d="M12 6.5V10M10.6 13.4 6.4 18M13.4 13.4l4.2 4.6"/></svg><span>Linhagens</span></a>
        <a href="#/cronologia" data-rota="cronologia"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v18M12 7h6M12 12H6M12 17h5"/></svg><span>Cronologia</span></a>
        <p class="nav-grupo">Música</p>
        <a href="#/discografia" data-rota="discografia"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="2.5"/></svg><span>Discografia</span></a>
        <a href="#/obras" data-rota="obras"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V5l11-2v13"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="17.5" cy="16" r="2.5"/></svg><span>Obras e letras</span></a>
        <a href="#/instrumentos" data-rota="instrumentos"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 3.5c.9 1.3 1.2 2.6.8 3.6l-2.7 2.7"/><circle cx="9" cy="15" r="6"/><circle cx="9" cy="15" r="1.6"/><path d="m12.6 9.8 5.9-5.9"/></svg><span>Instrumentos</span></a>
        <a href="#/mediateca" data-rota="mediateca"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m10 9 5 3-5 3z"/></svg><span>Mediateca</span></a>
        <p class="nav-grupo">Sobre o arquivo</p>
        <a href="#/fontes" data-rota="fontes"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 4 6v6c0 4.5 3.4 8 8 9 4.6-1 8-4.5 8-9V6z"/><path d="m8.5 12 2.5 2.5 4.5-5"/></svg><span>Fontes e arquivo</span></a>
        <a href="#/blogue" data-rota="blogue"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14v16H5z"/><path d="M8.5 8.5h7M8.5 12h7M8.5 15.5h4"/></svg><span>Blogue</span></a>
        <a href="#/contribuidores" data-rota="contribuidores"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10" cy="8" r="3.5"/><path d="M3.5 20c.8-3.6 3.4-5.6 6.5-5.6 1.4 0 2.7.4 3.8 1.2"/><path d="m18 13.5 1.1 2.3 2.4.3-1.8 1.7.5 2.4-2.2-1.2-2.2 1.2.5-2.4-1.8-1.7 2.4-.3z"/></svg><span>Contribuidores</span></a>
        <p class="nav-grupo" id="nav-reservada" hidden>Área reservada</p>
        <a href="#/validar" data-rota="validar" id="nav-validar" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 11.5l2 2 4-4.5"/><path d="M12 3l7 3v5c0 4.5-3 8.2-7 10-4-1.8-7-5.5-7-10V6z"/></svg><span>Por validar</span></a>
        <a href="#/propostas" data-rota="propostas" id="nav-propostas" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3v12M6 15a3 3 0 1 0 0 6 3 3 0 0 0 0-6zM18 9a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM18 9c0 5-6 4-12 6"/></svg><span>Propostas</span><b class="contagem"></b></a>
        <a href="#/alteracoes" data-rota="alteracoes" id="nav-alteracoes" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg><span>Alterações recentes</span></a>
      </nav>
      <div class="lateral-rodape">
        <a id="entrar" href="#/entrar" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 17l5-5-5-5M15 12H3M14 4h5a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1h-5"/></svg>
          <span>Entrar</span>
        </a>
        <button id="modo-edicao" type="button" role="switch" aria-checked="false" hidden
          title="Mostrar os botões e formulários para editar fichas, fontes, blogue e contribuidores">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="m13.5 6.5 4 4"/></svg>
          <span>Modo de edição: <b>desligado</b></span>
        </button>
        <button id="tema" type="button" title="Alternar tema claro/escuro">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg>
          <span>Tema</span>
        </button>
        <button id="recolher-menu" type="button" aria-expanded="true" title="Recolher o menu (só os ícones)">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="15" rx="2"/><path d="M9 4.5v15M15.5 9.5 13 12l2.5 2.5"/></svg>
          <span>Recolher menu</span>
        </button>
      </div>
      </div>
    </aside>

    <main id="vista" tabindex="-1"></main>
  </div>

  <aside id="painel" class="painel" role="dialog" aria-labelledby="painel-titulo" aria-hidden="true" tabindex="-1">
    <button class="fechar" data-fechar-painel aria-label="Fechar">×</button>
    <div id="painel-conteudo"></div>
  </aside>

  <section id="leitor" class="leitor" hidden aria-label="Leitor">
    <div class="leitor-ecra" id="leitor-ecra"></div>
    <div class="leitor-info">
      <p class="leitor-titulo" id="leitor-titulo"></p>
      <p class="leitor-sub" id="leitor-sub"></p>
    </div>
    <div class="leitor-botoes">
      <button id="leitor-ant" title="Anterior"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5v14M19 5 9 12l10 7z"/></svg></button>
      <button id="leitor-seg" title="Seguinte"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 5v14M5 5l10 7-10 7z"/></svg></button>
      <button id="leitor-fila-btn" title="Fila de audição" aria-label="Fila de audição"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h12M4 12h12M4 18h8M18 15v6l4-3z"/></svg><span id="leitor-n" aria-hidden="true"></span></button>
      <button id="leitor-expandir" title="Expandir"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
      <button id="leitor-fechar" title="Fechar leitor"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </div>
    <div class="leitor-fila" id="leitor-fila" hidden></div>
  </section>

  <div id="paleta" class="paleta" hidden>
    <div class="paleta-caixa" role="dialog" aria-modal="true" aria-label="Procurar">
      <input id="paleta-input" type="search" placeholder="Pessoa, obra, gravação, instrumento… ou pesquisar no arquivo" autocomplete="off"
        role="combobox" aria-label="Procurar" aria-autocomplete="list" aria-expanded="true" aria-controls="paleta-lista">
      <button type="button" class="paleta-fechar" data-fechar-paleta>Fechar</button>
      <ul id="paleta-lista" role="listbox" aria-label="Resultados"></ul>
      <p class="paleta-dica"><kbd>↑</kbd><kbd>↓</kbd> navegar · <kbd>Enter</kbd> abrir · <kbd>Esc</kbd> fechar</p>
    </div>
  </div>

  <div id="lightbox" class="lightbox" hidden role="dialog" aria-modal="true" aria-label="Imagem ampliada" tabindex="-1"></div>
  <button id="citar-selecao" class="citar-selecao" hidden type="button">Copiar como citação</button>
  <div id="aviso" class="aviso" role="status" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
